name: Controlla leak Juventus

on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/10 * * * *"

permissions:
  actions: write
  contents: write

concurrency:
  group: leakkit-check
  cancel-in-progress: false

jobs:
  check-leaks:
    name: Font, maglie e notizie
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v6

      - name: Configura Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip==26.1.2
          python -m pip install -r requirements.txt

      - name: Esegui test
        run: python -m unittest discover -s tests -v

      - name: Esegui tutti i monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u check.py

      - name: Salva lo stato unico
        if: always() && hashFiles('.leakkit_state.json') != ''
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .leakkit_state.json
          git diff --cached --quiet || git commit -m "Aggiorna stato LeakKit JR"
          git push

      - name: Pulisci la cronologia dei run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: "0"
        run: |
          gh api "repos/${{ github.repository }}/actions/workflows/check.yml/runs?status=completed&per_page=100" \
            --jq '.workflow_runs | sort_by(.created_at) | reverse | .['\"$KEEP\"':] | .[].id' |
          while read -r RUN_ID; do
            echo "Elimino run $RUN_ID"
            gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$RUN_ID" || true
          done
          echo "Pulizia completata."
