name: Scanner timestamp asset Juventus

on:
  workflow_dispatch:
    inputs:
      scan_start_date:
        description: "Data iniziale (Roma) - GG/MM/AAAA"
        required: true
        type: string
      scan_start_time:
        description: "Ora iniziale (Roma) - HH:MM:SS"
        required: true
        type: string
      scan_end_date:
        description: "Data finale (Roma) - GG/MM/AAAA"
        required: true
        type: string
      scan_end_time:
        description: "Ora finale (Roma) - HH:MM:SS"
        required: true
        type: string
      reset_state:
        description: "Avvia un nuovo intervallo e riparti dalla data iniziale"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Mostra soltanto l'intervallo senza fare richieste"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: leakkit-timestamp-assets
  cancel-in-progress: false

jobs:
  scan:
    name: Cerca immagini secondo per secondo
    runs-on: ubuntu-latest
    timeout-minutes: 75

    env:
      SCAN_START: "${{ inputs.scan_start_date }} ${{ inputs.scan_start_time }}"
      SCAN_FINAL_END: "${{ inputs.scan_end_date }} ${{ inputs.scan_end_time }}"
      REQUESTS_PER_SECOND: "20"
      CONCURRENCY: "30"
      RETRIES: "3"
      HTTP_TIMEOUT_SECONDS: "25"
      CHUNK_TIMESTAMPS: "60"
      CHECKPOINT_EVERY: "1"
      MAX_RUNTIME_SECONDS: "3600"
      PAUSE_AFTER_ASSET_SECONDS: "20"
      RESET_STATE: ${{ inputs.reset_state }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configura Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Installa le dipendenze già usate da LeakKit
        run: |
          python -m pip install --upgrade pip==26.1.2
          python -m pip install -r requirements.txt

      - name: Leggi l'istante esatto di avvio del workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_STARTED_AT_UTC="$(
            gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}" --jq '.created_at'
          )"
          echo "RUN_STARTED_AT_UTC=${RUN_STARTED_AT_UTC}" >> "$GITHUB_ENV"
          echo "Cutoff UTC del run: ${RUN_STARTED_AT_UTC}"

      - name: Controlla sintassi e test
        run: |
          python -m py_compile timestamp_scanner/scanner.py
          if [[ -d timestamp_scanner/tests ]]; then
            python -m unittest discover -s timestamp_scanner/tests -v
          fi

      - name: Scansiona fino all'istante di avvio del run
        id: scanner
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            python -u timestamp_scanner/scanner.py --dry-run
          else
            python -u timestamp_scanner/scanner.py
          fi

      - name: Salva il codice raggiunto e le foto inviate
        id: save_state
        if: ${{ always() && !inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add timestamp_scanner/state.json timestamp_scanner/found_assets.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare."
            exit 0
          fi

          git commit -m "Aggiorna avanzamento scanner timestamp"

          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Push fallito al tentativo ${attempt}; riprovo."
            sleep 5
          done

          echo "Impossibile salvare lo stato dopo 3 tentativi."
          exit 1

      - name: Decidi se avviare subito il run successivo
        id: continuation
        if: ${{ always() && !inputs.dry_run }}
        env:
          SCANNER_OUTCOME: ${{ steps.scanner.outcome }}
          SAVE_OUTCOME: ${{ steps.save_state.outcome }}
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from datetime import datetime
          from pathlib import Path

          state = json.loads(
              Path("timestamp_scanner/state.json").read_text(encoding="utf-8")
          )
          last_run = state.get("last_run") or {}
          scanner_failed = os.environ.get("SCANNER_OUTCOME") != "success"
          save_failed = os.environ.get("SAVE_OUTCOME") != "success"
          fatal = (
              scanner_failed
              or save_failed
              or last_run.get("stop_reason") == "fatal_error"
          )
          should_continue = not state.get("completed", False) and not fatal

          start = datetime.strptime(state["scan_start"], "%Y%m%d%H%M%S")
          end = datetime.strptime(state["final_end"], "%Y%m%d%H%M%S")

          print(f"continue={'true' if should_continue else 'false'}")
          print(f"completed={'true' if state.get('completed', False) else 'false'}")
          print(f"fatal={'true' if fatal else 'false'}")
          print(f"next_timestamp={state.get('next_timestamp', '')}")
          print(f"stop_reason={last_run.get('stop_reason', '')}")
          print(f"scan_start_date={start.strftime('%d/%m/%Y')}")
          print(f"scan_start_time={start.strftime('%H:%M:%S')}")
          print(f"scan_end_date={end.strftime('%d/%m/%Y')}")
          print(f"scan_end_time={end.strftime('%H:%M:%S')}")
          PY

      - name: Avvia immediatamente il workflow successivo
        if: ${{ steps.continuation.outputs.continue == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Prossimo codice: ${{ steps.continuation.outputs.next_timestamp }}"
          echo "Motivo fine run: ${{ steps.continuation.outputs.stop_reason }}"

          gh workflow run timestamp-assets.yml \
            --ref "${GITHUB_REF_NAME}" \
            -f "scan_start_date=${{ steps.continuation.outputs.scan_start_date }}" \
            -f "scan_start_time=${{ steps.continuation.outputs.scan_start_time }}" \
            -f "scan_end_date=${{ steps.continuation.outputs.scan_end_date }}" \
            -f "scan_end_time=${{ steps.continuation.outputs.scan_end_time }}" \
            -f "reset_state=false" \
            -f "dry_run=false"

          echo "Workflow successivo richiesto con lo stesso intervallo."

      - name: Intervallo definitivo completato
        if: ${{ steps.continuation.outputs.completed == 'true' }}
        run: |
          echo "Scansione completata fino a ${{ steps.continuation.outputs.scan_end_date }} ${{ steps.continuation.outputs.scan_end_time }}."
          echo "Nessun altro run verrà avviato."

      - name: Ferma la catena in caso di errore fatale
        if: ${{ steps.continuation.outputs.fatal == 'true' || steps.scanner.outcome == 'failure' || steps.save_state.outcome == 'failure' }}
        run: |
          echo "Errore fatale dello scanner. Stato salvato, ma la catena automatica è stata fermata."
          exit 1

      - name: Pulisci la cronologia dei run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -uo pipefail

          echo "Recupero l'ID del workflow corrente..."
          WORKFLOW_ID="$(
            gh api \
              "repos/${REPOSITORY}/actions/runs/${CURRENT_RUN_ID}" \
              --jq '.workflow_id'
          )"

          if [ -z "$WORKFLOW_ID" ]; then
            echo "::error::Impossibile recuperare l'ID del workflow."
            exit 1
          fi

          echo "Workflow ID: ${WORKFLOW_ID}"
          echo "Cerco tutti i run completati..."

          FOUND_RUNS=0
          DELETED_RUNS=0
          FAILED_RUNS=0

          while read -r RUN_ID; do
            if [ -z "$RUN_ID" ]; then
              continue
            fi

            FOUND_RUNS=$((FOUND_RUNS + 1))
            echo "Elimino il run ${RUN_ID}..."

            if gh api \
              --method DELETE \
              "repos/${REPOSITORY}/actions/runs/${RUN_ID}"
            then
              DELETED_RUNS=$((DELETED_RUNS + 1))
              echo "Run ${RUN_ID} eliminato."
            else
              FAILED_RUNS=$((FAILED_RUNS + 1))
              echo "::warning::Impossibile eliminare il run ${RUN_ID}."
            fi
          done < <(
            gh api \
              --paginate \
              "repos/${REPOSITORY}/actions/workflows/${WORKFLOW_ID}/runs?status=completed&per_page=100" \
              --jq '.workflow_runs[].id'
          )

          echo "Pulizia completata."
          echo "Run trovati: ${FOUND_RUNS}"
          echo "Run eliminati: ${DELETED_RUNS}"
          echo "Eliminazioni fallite: ${FAILED_RUNS}"
