name: Scanner timestamp asset Juventus

on:
  workflow_dispatch:
    inputs:
      reset_state:
        description: "Riparti dall'ora corrente (mantiene le foto già inviate)"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Mostra soltanto l'intervallo senza fare richieste"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "37 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: leakkit-timestamp-assets
  cancel-in-progress: false

jobs:
  scan:
    name: Cerca immagini secondo per secondo
    runs-on: ubuntu-latest
    timeout-minutes: 180

    outputs:
      successor_requested: ${{ steps.start_successor.outputs.successor_requested }}

    env:
      REQUESTS_PER_SECOND: "20"
      CONCURRENCY: "30"
      RETRIES: "3"
      HTTP_TIMEOUT_SECONDS: "25"
      CHUNK_TIMESTAMPS: "60"
      CHECKPOINT_EVERY: "1"
      MAX_RUNTIME_SECONDS: "3600"
      PAUSE_AFTER_ASSET_SECONDS: "20"
      WAIT_FOR_CLOSED_HOUR: "true"
      RESET_STATE: ${{ github.event_name == 'workflow_dispatch' && inputs.reset_state || false }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_RICH_MESSAGES: "1"

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configura Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Installa le dipendenze già usate da LeakKit
        run: |
          python -m pip install --upgrade pip==26.1.2
          python -m pip install -r requirements.txt

      - name: Leggi l'istante esatto di avvio del workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          RUN_STARTED_AT_UTC="$(
            gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}" --jq '.created_at'
          )"

          echo "RUN_STARTED_AT_UTC=${RUN_STARTED_AT_UTC}" >> "$GITHUB_ENV"
          echo "Cutoff UTC del run: ${RUN_STARTED_AT_UTC}"

      - name: Controlla sintassi e test
        run: |
          python -m py_compile timestamp_scanner/scanner.py

          if [[ -d timestamp_scanner/tests ]]; then
            python -m unittest discover -s timestamp_scanner/tests -v
          fi

      - name: Attendi e scansiona la prossima ora completa
        id: scanner
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail

          if [[ "${DRY_RUN}" == "true" ]]; then
            python -u timestamp_scanner/scanner.py --dry-run
            exit 0
          fi

          # Lo scanner copre una sola ora per esecuzione. Se il sito risponde con
          # un errore temporaneo (per esempio HTTP 403), non si esce subito:
          # si aspetta e si riprova dallo stesso secondo, restando dentro
          # circa un'ora di run. Un tentativo ogni 10 minuti, mai a raffica.
          START_EPOCH="$(date +%s)"
          RETRY_WINDOW_SECONDS=3000
          RETRY_PAUSE_SECONDS=600

          while true; do
            STATUS=0
            python -u timestamp_scanner/scanner.py || STATUS=$?

            if [[ "$STATUS" -ne 0 ]]; then
              exit "$STATUS"
            fi

            STOP_REASON="$(
              python -c "import json; print((json.load(open('timestamp_scanner/state.json')).get('last_run') or {}).get('stop_reason', ''))"
            )"

            if [[ "$STOP_REASON" != "transient_http_error" ]]; then
              exit 0
            fi

            ELAPSED=$(( $(date +%s) - START_EPOCH ))
            if (( ELAPSED + RETRY_PAUSE_SECONDS > RETRY_WINDOW_SECONDS )); then
              echo "Blocco ancora attivo dopo ${ELAPSED}s: chiudo il run."
              exit 0
            fi

            echo "Errore temporaneo del sito. Nuovo tentativo tra ${RETRY_PAUSE_SECONDS}s (trascorsi ${ELAPSED}s)."
            sleep "$RETRY_PAUSE_SECONDS"
          done

      - name: Salva il codice raggiunto e le foto inviate
        id: save_state
        if: ${{ always() && env.DRY_RUN != 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          STATE_BACKUP="$(mktemp -d)"
          cp timestamp_scanner/state.json "${STATE_BACKUP}/state.json"
          cp timestamp_scanner/found_assets.json "${STATE_BACKUP}/found_assets.json"
          trap 'rm -rf "${STATE_BACKUP}"' EXIT

          for attempt in 1 2 3; do
            echo "Tentativo salvataggio stato ${attempt}/3..."

            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"

            cp "${STATE_BACKUP}/state.json" timestamp_scanner/state.json
            cp "${STATE_BACKUP}/found_assets.json" timestamp_scanner/found_assets.json

            git add timestamp_scanner/state.json timestamp_scanner/found_assets.json

            if git diff --cached --quiet; then
              echo "Lo stato remoto è già identico a quello appena prodotto."
              exit 0
            fi

            git commit -m "Aggiorna avanzamento scanner timestamp"

            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Stato salvato correttamente."
              exit 0
            fi

            echo "Il branch è cambiato durante il push. Riparto dall'ultimo main e riprovo."
            sleep 5
          done

          echo "::error::Impossibile salvare lo stato dopo 3 tentativi."
          exit 1

      - name: Decidi se avviare subito il run successivo
        id: continuation
        if: ${{ always() && !cancelled() && env.DRY_RUN != 'true' }}
        env:
          SCANNER_OUTCOME: ${{ steps.scanner.outcome }}
          SAVE_OUTCOME: ${{ steps.save_state.outcome }}
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path

          try:
              state = json.loads(
                  Path("timestamp_scanner/state.json").read_text(encoding="utf-8")
              )
              state_error = ""
          except Exception as exc:
              state = {}
              state_error = f"{type(exc).__name__}: {exc}"

          last_run = state.get("last_run") or {}
          scanner_failed = os.environ.get("SCANNER_OUTCOME") != "success"
          save_failed = os.environ.get("SAVE_OUTCOME") != "success"

          # Errore grave o blocco del sito (403/HTTP transitorio): la catena si
          # ferma e riparte con lo schedule orario, invece di rilanciarsi subito
          # in loop ogni pochi secondi.
          fatal = (
              scanner_failed
              or save_failed
              or bool(state_error)
              or bool(last_run.get("fatal_error"))
              or last_run.get("stop_reason") in ("fatal_error", "transient_http_error")
          )

          caught_up = bool(state.get("caught_up", False))

          print(f"continue={'false' if fatal else 'true'}")
          print(f"caught_up={'true' if caught_up else 'false'}")
          print(f"fatal={'true' if fatal else 'false'}")
          print(f"next_timestamp={state.get('next_timestamp', '')}")
          print(f"stop_reason={last_run.get('stop_reason', '')}")
          print(f"state_error={state_error.replace(chr(10), ' ')}")
          PY

      - name: Avvia il workflow che attenderà l'ora successiva
        id: start_successor
        if: ${{ steps.continuation.outputs.continue == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Prossimo codice: ${{ steps.continuation.outputs.next_timestamp }}"
          echo "Motivo fine run: ${{ steps.continuation.outputs.stop_reason }}"

          MAX_ATTEMPTS=10

          for ATTEMPT in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "Avvio del run successivo..."
            echo "Tentativo ${ATTEMPT}/${MAX_ATTEMPTS}"

            if OUTPUT=$(gh workflow run timestamp-assets.yml \
              --ref "${GITHUB_REF_NAME}" 2>&1); then

              if [[ -n "$OUTPUT" ]]; then
                echo "$OUTPUT"
              fi

              echo "successor_requested=true" >> "$GITHUB_OUTPUT"

              echo "Avvio riuscito."
              exit 0
            fi

            echo "$OUTPUT" >&2

            if [[ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]]; then
              # Attesa crescente: 15, 30, 60, poi sempre 60 secondi.
              WAIT=$((15 * (2 ** (ATTEMPT - 1))))
              if [[ "$WAIT" -gt 60 ]]; then
                WAIT=60
              fi

              echo "Avvio fallito, nuovo tentativo tra ${WAIT} secondi..."
              sleep "${WAIT}"
            fi
          done

          echo "successor_requested=false" >> "$GITHUB_OUTPUT"
          echo "::error::Impossibile avviare il run successivo dopo ${MAX_ATTEMPTS} tentativi."
          exit 1

      - name: Pulisci la cronologia dei run dello scanner
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: "0"
        run: |
          gh api \
            "repos/${{ github.repository }}/actions/workflows/timestamp-assets.yml/runs?status=completed&per_page=100" \
            --jq '.workflow_runs | sort_by(.created_at) | reverse | .['"$KEEP"':] | .[].id' |
          while read -r RUN_ID; do
            if [ -n "$RUN_ID" ]; then
              echo "Elimino run $RUN_ID"

              gh api -X DELETE \
                "repos/${{ github.repository }}/actions/runs/$RUN_ID" || true
            fi
          done

          echo "Pulizia completata."
