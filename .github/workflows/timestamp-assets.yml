name: Scanner timestamp asset Juventus

on:
  workflow_dispatch:
    inputs:
      reset_state:
        description: "Riparti dall'ora corrente (mantiene le foto già inviate)"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Mostra soltanto l'intervallo senza fare richieste"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: leakkit-timestamp-assets
  cancel-in-progress: false

jobs:
  scan:
    name: Cerca immagini secondo per secondo
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      REQUESTS_PER_SECOND: "20"
      CONCURRENCY: "30"
      RETRIES: "3"
      HTTP_TIMEOUT_SECONDS: "25"
      CHUNK_TIMESTAMPS: "60"
      CHECKPOINT_EVERY: "1"
      MAX_RUNTIME_SECONDS: "3600"
      PAUSE_AFTER_ASSET_SECONDS: "20"
      WAIT_FOR_CLOSED_HOUR: "true"
      RESET_STATE: ${{ github.event_name == 'workflow_dispatch' && inputs.reset_state || false }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configura Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Installa le dipendenze già usate da LeakKit
        run: |
          python -m pip install --upgrade pip==26.1.2
          python -m pip install -r requirements.txt

      - name: Leggi l'istante esatto di avvio del workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_STARTED_AT_UTC="$(
            gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}" --jq '.created_at'
          )"
          echo "RUN_STARTED_AT_UTC=${RUN_STARTED_AT_UTC}" >> "$GITHUB_ENV"
          echo "Cutoff UTC del run: ${RUN_STARTED_AT_UTC}"

      - name: Controlla sintassi e test
        run: |
          python -m py_compile timestamp_scanner/scanner.py
          if [[ -d timestamp_scanner/tests ]]; then
            python -m unittest discover -s timestamp_scanner/tests -v
          fi

      - name: Attendi e scansiona la prossima ora completa
        id: scanner
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          if [[ "${DRY_RUN}" == "true" ]]; then
            python -u timestamp_scanner/scanner.py --dry-run
          else
            python -u timestamp_scanner/scanner.py
          fi

      - name: Salva il codice raggiunto e le foto inviate
        id: save_state
        if: ${{ always() && env.DRY_RUN != 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Conserva lo stato appena prodotto da questo run.
          STATE_BACKUP="$(mktemp -d)"
          cp timestamp_scanner/state.json "${STATE_BACKUP}/state.json"
          cp timestamp_scanner/found_assets.json "${STATE_BACKUP}/found_assets.json"
          trap 'rm -rf "${STATE_BACKUP}"' EXIT

          for attempt in 1 2 3; do
            echo "Tentativo salvataggio stato ${attempt}/3..."

            # Prende l'ultimo main senza fare merge/rebase di state.json.
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"

            # Lo stato di QUESTO run deve vincere sullo stato remoto vecchio.
            cp "${STATE_BACKUP}/state.json" timestamp_scanner/state.json
            cp "${STATE_BACKUP}/found_assets.json" timestamp_scanner/found_assets.json

            git add timestamp_scanner/state.json timestamp_scanner/found_assets.json

            if git diff --cached --quiet; then
              echo "Lo stato remoto è già identico a quello appena prodotto."
              exit 0
            fi

            git commit -m "Aggiorna avanzamento scanner timestamp"

            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Stato salvato correttamente."
              exit 0
            fi

            echo "Il branch è cambiato durante il push. Riparto dall'ultimo main e riprovo."
            sleep 5
          done

          echo "::error::Impossibile salvare lo stato dopo 3 tentativi."
          exit 1
      - name: Decidi se avviare subito il run successivo
        id: continuation
        if: ${{ always() && !cancelled() && env.DRY_RUN != 'true' }}
        env:
          SCANNER_OUTCOME: ${{ steps.scanner.outcome }}
          SAVE_OUTCOME: ${{ steps.save_state.outcome }}
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path

          try:
              state = json.loads(
                  Path("timestamp_scanner/state.json").read_text(encoding="utf-8")
              )
              state_error = ""
          except Exception as exc:
              state = {}
              state_error = f"{type(exc).__name__}: {exc}"
          last_run = state.get("last_run") or {}
          scanner_failed = os.environ.get("SCANNER_OUTCOME") != "success"
          save_failed = os.environ.get("SAVE_OUTCOME") != "success"
          fatal = (
              scanner_failed
              or save_failed
              or bool(state_error)
              or last_run.get("stop_reason") == "fatal_error"
          )
          caught_up = bool(state.get("caught_up", False))

          print("continue=true")
          print(f"caught_up={'true' if caught_up else 'false'}")
          print(f"fatal={'true' if fatal else 'false'}")
          print(f"next_timestamp={state.get('next_timestamp', '')}")
          print(f"stop_reason={last_run.get('stop_reason', '')}")
          print(f"state_error={state_error.replace(chr(10), ' ')}")
          PY

      - name: Avvia il workflow che attenderà l'ora successiva
        if: ${{ steps.continuation.outputs.continue == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Prossimo codice: ${{ steps.continuation.outputs.next_timestamp }}"
          echo "Motivo fine run: ${{ steps.continuation.outputs.stop_reason }}"

          for attempt in 1 2 3; do
            echo "Tentativo avvio workflow successivo ${attempt}/3..."
            if gh workflow run timestamp-assets.yml \
              --ref "${GITHUB_REF_NAME}" \
              -f "reset_state=false" \
              -f "dry_run=false"
            then
              echo "Workflow successivo richiesto dal punto salvato."
              echo "Se l'ora non è ancora conclusa, il nuovo job resterà in attesa."
              exit 0
            fi
            sleep 10
          done

          echo "::error::Impossibile richiedere il workflow successivo dopo 3 tentativi."
          exit 1

      - name: Segnala l'errore dopo avere richiesto un nuovo job
        if: ${{ steps.continuation.outputs.fatal == 'true' || steps.scanner.outcome == 'failure' || steps.save_state.outcome == 'failure' }}
        run: |
          echo "Il run ha incontrato un errore, ma il workflow successivo è già stato richiesto."
          echo "Il nuovo job ripartirà dall'ultimo cursore disponibile."
          exit 1

      - name: Pulisci la cronologia dei run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -uo pipefail

          echo "Recupero l'ID del workflow corrente..."
          WORKFLOW_ID="$(
            gh api \
              "repos/${REPOSITORY}/actions/runs/${CURRENT_RUN_ID}" \
              --jq '.workflow_id'
          )"

          if [ -z "$WORKFLOW_ID" ]; then
            echo "::error::Impossibile recuperare l'ID del workflow."
            exit 1
          fi

          echo "Workflow ID: ${WORKFLOW_ID}"
          echo "Cerco tutti i run completati..."

          FOUND_RUNS=0
          DELETED_RUNS=0
          FAILED_RUNS=0

          while read -r RUN_ID; do
            if [ -z "$RUN_ID" ]; then
              continue
            fi

            FOUND_RUNS=$((FOUND_RUNS + 1))
            echo "Elimino il run ${RUN_ID}..."

            if gh api \
              --method DELETE \
              "repos/${REPOSITORY}/actions/runs/${RUN_ID}"
            then
              DELETED_RUNS=$((DELETED_RUNS + 1))
              echo "Run ${RUN_ID} eliminato."
            else
              FAILED_RUNS=$((FAILED_RUNS + 1))
              echo "::warning::Impossibile eliminare il run ${RUN_ID}."
            fi
          done < <(
            gh api \
              --paginate \
              "repos/${REPOSITORY}/actions/workflows/${WORKFLOW_ID}/runs?status=completed&per_page=100" \
              --jq '.workflow_runs[].id'
          )

          echo "Pulizia completata."
          echo "Run trovati: ${FOUND_RUNS}"
          echo "Run eliminati: ${DELETED_RUNS}"
          echo "Eliminazioni fallite: ${FAILED_RUNS}"
